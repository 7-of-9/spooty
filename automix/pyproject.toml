[project]
name = "spooty-automix"
version = "0.1.0"
description = "Spooty offline auto-mix spike: analyse a folder, plan, audition transitions, render"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy",
  "scipy",
  "soundfile",
  "soxr",
  "pyloudnorm",
  "librosa",
  "essentia",
  "torch",
  "beat_this @ git+https://github.com/CPJKU/beat_this.git",
]

[project.scripts]
automix = "automix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["automix"]

[tool.hatch.metadata]
allow-direct-references = true
